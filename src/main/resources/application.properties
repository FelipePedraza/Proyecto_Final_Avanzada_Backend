# Configuracion de conexion a Azure SQL Server para Spring Boot
spring.datasource.url=jdbc:sqlserver://${AZURE_SQL_HOST}:${AZURE_SQL_PORT};database=${AZURE_SQL_DATABASE};encrypt=true;trustServerCertificate=false;hostNameInCertificate=*.database.windows.net;loginTimeout=30
spring.datasource.username=${AZURE_SQL_USERNAME}
spring.datasource.password=${AZURE_SQL_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Configuracion JPA/Hibernate para SQL Server
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# Configuraciones especificas para Azure SQL Server
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=600000

# Health Checks y Actuator (para Azure App Service Health Check)
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
management.health.db.enabled=true
management.health.diskspace.enabled=true
management.metrics.export.prometheus.enabled=true
management.metrics.tags.application=vivigo-backend

#Configuracion del JWTUtils
secretKey=${SECRETKEY}

# Configuracion SMTP para Spring Mail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAILUSERNAME}
spring.mail.password=${MAILPASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Configuracion Cloudinary
cloud.name=dxvvp4ote
cloud.api.key=${CLOUDAPIKEY}
cloud.api.key.secret=${CLOUDAPIKEYSECRET}

# Puerto (Elastic Beanstalk usa el 5000 por defecto para Java)
server.port=5000

# Configuraciones de seguridad para produccion
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# Logging estructurado para Azure Monitor
logging.level.root=INFO
logging.level.co.edu.uniquindio=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=WARN

# Tamanos maximo de archivos para upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Configuracion api Stripe
stripe.secret-key=${STRIPESECRETKEY}
stripe.webhook-secret=${STRIPEWEBHOOKSECRET}
stripe.currency=cop