# Configuración de conexión a MariaDB para Spring Boot
spring.datasource.url=jdbc:mariadb://${MYSQLHOST}:${MYSQLPORT}/${MYSQL_DATABASE}?serverTimezone=UTC&allowPublicKeyRetrieval=true&sslMode=trust
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# Configuración JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect

#Configuración del JWTUtils
secretKey=${SECRETKEY}

# Configuración SMTP para Spring Mail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAILUSERNAME}
spring.mail.password=${MAILPASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Configuración Cloudinary
cloud.name=dxvvp4ote
cloud.api.key=${CLOUDAPIKEY}
cloud.api.key.secret=${CLOUDAPIKEYSECRET}

# Puerto (Elastic Beanstalk usa el 5000 por defecto para Java)
server.port=5000