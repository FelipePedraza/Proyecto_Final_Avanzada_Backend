# Perfil local para pruebas manuales antes de push
spring.profiles.active=local

# H2 en memoria
spring.datasource.url=jdbc:h2:mem:vivigo;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Consola H2 (accesible en /h2-console)
spring.h2.console.enabled=true

# Actuator + Prometheus
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
management.metrics.export.prometheus.enabled=true
management.metrics.tags.application=vivigo-backend

# JWT de prueba
secretKey=claveDePruebaLocalParaJWT1234567890

# Mail (modo noop - no envía realmente en local)
spring.mail.host=localhost
spring.mail.port=1025

# Cloudinary dummy
cloud.name=dummy
cloud.api.key=dummy
cloud.api.key.secret=dummy

# Stripe dummy
stripe.secret-key=sk_test_dummy
stripe.webhook-secret=whsec_dummy
stripe.currency=cop

# Puerto local
server.port=8080

# Logging
logging.level.co.edu.uniquindio=DEBUG
logging.level.org.springframework.web=DEBUG
